name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: node --test --test-timeout=30000 test/*.test.mjs
      - run: npm pack --dry-run

  bun-ca:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun test test/network.test.mjs --test-name-pattern "Bun " --timeout 30000

  native-usage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.93.1
      - run: cargo test --locked --manifest-path paseo/Cargo.toml
      - run: node build-paseo.mjs
      - name: Validate native usage registration
        shell: bash
        run: |
          binary=$(node -p "JSON.parse(require('node:fs').readFileSync('paseo-plugin.json', 'utf8')).server.executable")
          "$binary" --validate . 0.13.13
