[package]
name = "omp-kiro-usage"
version = "0.5.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Read-only Kiro account usage source for Passession"
repository = "https://github.com/emotionbug/omp-kiro"
publish = false

[dependencies]
paseo-plugin = { git = "https://github.com/emotionbug/Passession", rev = "fcf10d601ed75cd2177a0255569e2b19990c1a47" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "debuginfo"
